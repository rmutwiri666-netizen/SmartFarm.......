services:
  - type: web
    name: smartfarm-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: smartfarm-db
          property: connectionString
      - key: SMARTFARM_ALLOWED_ORIGINS
        sync: false
      - key: PG_POOL_MAX
        value: 5
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PARTY_B
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline

databases:
  - name: smartfarm-db
    databaseName: smartfarm
    user: smartfarm
    plan: 0.1c-256mb
